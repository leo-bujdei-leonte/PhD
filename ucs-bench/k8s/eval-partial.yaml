# Evaluate DirectMe + Qwen3-VL on the graphs the full run has finished so far, without
# waiting for all 8 shards. Takes a snapshot when the pod starts: links every graph with a
# .complete marker (in-progress graphs are saved after every chunk, so they are left out)
# and keeps only the questions for those videos. Leaves the full run alone: it does not
# touch results/directme_qwen3vl.json or eval.lock, so the last shard still evaluates.
#
#   kubectl create -f PhD/ucs-bench/k8s/eval-partial.yaml
# Output: /pvc/runs/full/partial/<UTC timestamp>/{videos.txt,questions.jsonl,graphs/,eval.log,directme_qwen3vl.json}
apiVersion: batch/v1
kind: Job
metadata:
 generateName: ucs-bench-eval-partial-
 labels:
  kueue.x-k8s.io/queue-name:  eidf029ns-user-queue
  eidf/user: s2992811-infk8s
spec:
 completions: 1
 backoffLimit: 1
 activeDeadlineSeconds: 172800      # 2 days
 ttlSecondsAfterFinished: 86400
 template:
  metadata:
   labels:
    eidf/user: s2992811-infk8s
  spec:
   restartPolicy: Never
   # Any GPU model (A100/H100/H200): this is only Qwen3-VL-8B inference (~17 GB), so it
   # need not wait for an A100. H100/H200 nodes don't carry eidf029_node, so that goes too.
   nodeSelector:
    nvidia.com/gpu.present: "true"
   containers:
   - name: ucs-bench
     image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
     command: ["/bin/bash", "-c"]
     args:
     - |
       set -euo pipefail
       apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0 >/dev/null
       source /pvc/venv/bin/activate
       cd /pvc/UCS-Bench
       nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
       P=/pvc/runs/full/partial/$(date -u +%Y%m%dT%H%MZ); mkdir -p "$P/graphs"
       # Per-file links in real folders: pathlib's rglob does not descend into symlinked dirs.
       for g in /pvc/runs/full/graphs/*/; do
         v=$(basename "$g")
         if [ -f "$g.complete" ]; then
           mkdir "$P/graphs/$v" && ln -s "${g}scene_graph.json" "$P/graphs/$v/" && echo "$v" >> "$P/videos.txt"
         fi
       done
       python -I - "$P/videos.txt" /pvc/ucs-eval/questions_full.jsonl "$P/questions.jsonl" <<'PY'
       import json, sys
       vids = set(open(sys.argv[1]).read().split())
       rows = [l for l in open(sys.argv[2]) if l.strip() and json.loads(l)["video_uid"] in vids]
       open(sys.argv[3], "w").writelines(rows)
       print(f"[partial] {len(vids)} complete graphs, {len(rows)} questions -> {sys.argv[3]}")
       PY
       python examples/evaluate_ucsbench_vlm.py \
         --questions "$P/questions.jsonl" --graphs-dir "$P/graphs" \
         --backend transformers --model "${VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}" \
         --out "$P/directme_qwen3vl.json" 2>&1 | tee "$P/eval.log"
       echo "results: $P/directme_qwen3vl.json"
     env:
     - name: HF_HOME
       value: /pvc/hf
     - name: PYTHONUNBUFFERED
       value: "1"
     # The container sees all 124 host CPUs but is limited to 16 (resources below), so
     # without these PyTorch/OpenMP start ~124 threads and get throttled. Keep = cpu limit.
     - name: OMP_NUM_THREADS
       value: "16"
     - name: MKL_NUM_THREADS
       value: "16"
     - name: OPENBLAS_NUM_THREADS
       value: "16"
     - name: DEBIAN_FRONTEND
       value: noninteractive
     resources:
      requests:
       cpu: 16
       memory: '64Gi'
      limits:
       cpu: 16
       memory: '96Gi'
       nvidia.com/gpu: 1
     volumeMounts:
     - name: pvc
       mountPath: /pvc
     - name: scripts
       mountPath: /scripts
     - name: dshm
       mountPath: /dev/shm
   volumes:
   - name: pvc
     persistentVolumeClaim:
      claimName: s2992811-ucs-bench
   - name: scripts
     configMap:
      name: s2992811-ucs-bench-scripts
   - name: dshm
     emptyDir:
      medium: Memory
      sizeLimit: 16Gi
