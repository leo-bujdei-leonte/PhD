# Small CPU-only job that mounts the UCS-Bench PVC, for copying files in or out when no
# GPU job is running. `kubectl run` is disabled, and the namespace requires generateName
# and a Kueue queue label, so it is a Job like the others. Sleeps 1 h, then exits.
# CPU-only jobs use Kueue's default-flavor, whose CPU quota is small and shared: keep the
# request low (1 CPU was refused with ~750m free on 2026-11-19).
#
#   P=$(kubectl create -f PhD/ucs-bench/k8s/pvc-shell.yaml -o name)
#   kubectl wait --for=condition=Ready pod -l job-name=${P#job.batch/} --timeout=10m
#   POD=$(kubectl get pod -l job-name=${P#job.batch/} -o name)
#   kubectl cp ${POD#pod/}:/pvc/runs/full/results/directme_qwen3vl.json directme_qwen3vl.json
#   kubectl exec $POD -- tar -cf - -C /pvc/runs/full results | tar -xf - -C <dest>
#   kubectl delete -y $P
apiVersion: batch/v1
kind: Job
metadata:
  generateName: s2992811-pvc-shell-
  labels:
    kueue.x-k8s.io/queue-name: eidf029ns-user-queue
    eidf/user: s2992811-infk8s
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        eidf/user: s2992811-infk8s
    spec:
      restartPolicy: Never
      containers:
      - name: shell
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: 500m, memory: 1Gi}
        volumeMounts:
        - name: pvc
          mountPath: /pvc
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: s2992811-ucs-bench
