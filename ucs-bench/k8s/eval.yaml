# DirectMe + Qwen3-VL-8B-Instruct evaluation on UCS-Bench, following the UCS-Bench README
# ("Evaluating on UCS-Bench"): build a scene graph per video with
# examples/run_real_pipeline.py, then run examples/evaluate_ucsbench_vlm.py with
# --backend transformers --model Qwen/Qwen3-VL-8B-Instruct.
#
# Two job templates:
#   ucs-bench-subset-*    1 GPU, 10 videos / 262 questions -> /pvc/runs/subset/results/
#   ucs-bench-full-<i>-*  shard i of 8 (1 GPU each), 532 videos / 8114 questions in all
#                         -> /pvc/runs/full/results/. Separate 1-GPU jobs rather than one
#                         Indexed job, so each shard starts as soon as any GPU is free
#                         instead of waiting for 8 at once. The last shard to finish runs
#                         the evaluation on all graphs.
#
# Prerequisites, in order (all in this directory):
#   kubectl create -f PhD/ucs-bench/k8s/pvc.yaml
#   kubectl create configmap s2992811-ucs-bench-scripts --from-file=PhD/ucs-bench/k8s/scripts
#   kubectl create -f PhD/ucs-bench/k8s/prepare.yaml      # wait for it to complete
# Then (subset = first document; full = second, once per shard with SHARD filled in):
#   awk '/^---$/{exit} {print}' PhD/ucs-bench/k8s/eval.yaml | kubectl create -f -
#   for i in $(seq 0 7); do awk 'f; /^---$/{f=1}' PhD/ucs-bench/k8s/eval.yaml \
#     | sed "s/SHARD/$i/g" | kubectl create -f - -o name; done
#
# The old 5-test GPU smoke test is in smoke.yaml.
apiVersion: batch/v1
kind: Job
metadata:
 generateName: ucs-bench-subset-
 labels:
  kueue.x-k8s.io/queue-name:  eidf029ns-user-queue
  eidf/user: s2992811-infk8s
spec:
 completions: 1
 backoffLimit: 2                    # resumable: a retry skips finished videos
 activeDeadlineSeconds: 86400
 ttlSecondsAfterFinished: 86400
 template:
  metadata:
   labels:
    eidf/user: s2992811-infk8s
  spec:
   restartPolicy: Never
   nodeSelector:
    eidf029_node: "true"
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
   containers:
   - name: ucs-bench
     image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
     command: ["/bin/bash", "/scripts/run.sh", "subset", "1"]
     env:
     - name: HF_HOME
       value: /pvc/hf
     - name: PYTHONUNBUFFERED
       value: "1"
     # The container sees all 124 host CPUs but is limited to 16 (resources below), so
     # without these PyTorch/OpenMP start ~124 threads and get throttled. Keep = cpu limit.
     - name: OMP_NUM_THREADS
       value: "16"
     - name: MKL_NUM_THREADS
       value: "16"
     - name: OPENBLAS_NUM_THREADS
       value: "16"
     - name: DEBIAN_FRONTEND
       value: noninteractive
     resources:
      requests:
       cpu: 16
       memory: '64Gi'
      limits:
       cpu: 16
       memory: '96Gi'
       nvidia.com/gpu: 1
     volumeMounts:
     - name: pvc
       mountPath: /pvc
     - name: scripts
       mountPath: /scripts
     - name: dshm
       mountPath: /dev/shm
   volumes:
   - name: pvc
     persistentVolumeClaim:
      claimName: s2992811-ucs-bench
   - name: scripts
     configMap:
      name: s2992811-ucs-bench-scripts
   - name: dshm
     emptyDir:
      medium: Memory
      sizeLimit: 16Gi
---
apiVersion: batch/v1
kind: Job
metadata:
 generateName: ucs-bench-full-SHARD-
 labels:
  kueue.x-k8s.io/queue-name:  eidf029ns-user-queue
  eidf/user: s2992811-infk8s
spec:
 completions: 1
 backoffLimit: 2                    # resumable: a retried shard skips finished videos
 activeDeadlineSeconds: 432000      # 5 days
 ttlSecondsAfterFinished: 86400
 template:
  metadata:
   labels:
    eidf/user: s2992811-infk8s
  spec:
   restartPolicy: Never
   nodeSelector:
    eidf029_node: "true"
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
   containers:
   - name: ucs-bench
     image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
     command: ["/bin/bash", "/scripts/run.sh", "full", "8"]
     env:
     - name: JOB_COMPLETION_INDEX     # shard 0..7; run.sh reads it as in an Indexed Job
       value: "SHARD"
     - name: HF_HOME
       value: /pvc/hf
     - name: PYTHONUNBUFFERED
       value: "1"
     # The container sees all 124 host CPUs but is limited to 16 (resources below), so
     # without these PyTorch/OpenMP start ~124 threads and get throttled. Keep = cpu limit.
     - name: OMP_NUM_THREADS
       value: "16"
     - name: MKL_NUM_THREADS
       value: "16"
     - name: OPENBLAS_NUM_THREADS
       value: "16"
     - name: DEBIAN_FRONTEND
       value: noninteractive
     resources:
      requests:
       cpu: 16
       memory: '64Gi'
      limits:
       cpu: 16
       memory: '96Gi'
       nvidia.com/gpu: 1
     volumeMounts:
     - name: pvc
       mountPath: /pvc
     - name: scripts
       mountPath: /scripts
     - name: dshm
       mountPath: /dev/shm
   volumes:
   - name: pvc
     persistentVolumeClaim:
      claimName: s2992811-ucs-bench
   - name: scripts
     configMap:
      name: s2992811-ucs-bench-scripts
   - name: dshm
     emptyDir:
      medium: Memory
      sizeLimit: 16Gi